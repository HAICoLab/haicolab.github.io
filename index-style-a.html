<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAICoLab - Style A (Abstract/Artistic)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Style A: Abstract/Artistic */
    .hero-banner {
      position: relative;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #7c3aed 100%);
      overflow: hidden;
    }

    /* Abstract flowing shapes background */
    .abstract-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.6;
    }

    .flow-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float-abstract 20s ease-in-out infinite;
    }

    .shape1 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.6) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .shape2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.5) 0%, transparent 70%);
      bottom: -150px;
      right: -150px;
      animation-delay: 5s;
    }

    .shape3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(96, 165, 250, 0.4) 0%, transparent 70%);
      top: 50%;
      right: 10%;
      animation-delay: 10s;
    }

    @keyframes float-abstract {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(30px, -30px) scale(1.1);
      }
      66% {
        transform: translate(-20px, 20px) scale(0.95);
      }
    }

    /* SVG Abstract Pattern */
    .svg-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.15;
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      color: white;
      padding: 4rem 1rem;
    }

    .hero-title {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      letter-spacing: 2px;
    }

    .hero-subtitle {
      font-size: 1.8rem;
      font-weight: 300;
      margin-bottom: 2rem;
      opacity: 0.95;
    }

    /* Abstract symbol */
    .abstract-symbol {
      margin: 3rem auto;
      width: 200px;
      height: 200px;
      position: relative;
    }

    .symbol-ring {
      position: absolute;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    .ring1 { width: 80px; height: 80px; top: 60px; left: 60px; animation-delay: 0s; }
    .ring2 { width: 120px; height: 120px; top: 40px; left: 40px; animation-delay: 1s; }
    .ring3 { width: 160px; height: 160px; top: 20px; left: 20px; animation-delay: 2s; }

    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.6;
      }
    }

    .central-dot {
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 90px;
      left: 90px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
    }

    @media (max-width: 768px) {
      .hero-title { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">HAICoLab - Style A</a>
      <div class="ms-auto">
        <a href="index-style-a.html" class="btn btn-sm btn-primary me-2">A</a>
        <a href="index-style-b.html" class="btn btn-sm btn-outline-primary me-2">B</a>
        <a href="index-style-c.html" class="btn btn-sm btn-outline-primary">C</a>
      </div>
    </div>
  </nav>

  <div class="hero-banner">
    <!-- Abstract flowing shapes -->
    <div class="abstract-bg">
      <div class="flow-shape shape1"></div>
      <div class="flow-shape shape2"></div>
      <div class="flow-shape shape3"></div>
    </div>

    <!-- SVG Pattern -->
    <svg class="svg-pattern">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <circle cx="20" cy="20" r="1" fill="white" opacity="0.3"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
    </svg>

    <div class="hero-content">
      <h1 class="hero-title">HAICoLab</h1>
      <p class="hero-subtitle">Human-AI Collaboration Lab</p>

      <!-- Abstract Symbol -->
      <div class="abstract-symbol">
        <div class="symbol-ring ring1"></div>
        <div class="symbol-ring ring2"></div>
        <div class="symbol-ring ring3"></div>
        <div class="central-dot"></div>
      </div>

      <p style="font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin: 2rem auto;">
        Exploring the synergy between human and artificial intelligence
      </p>
    </div>
  </div>

  <div class="section">
    <div class="container text-center">
      <h3>Style A: Abstract / Artistic</h3>
      <p>흐르는 형태, 기하학적 패턴, 추상적 심볼로 협업을 표현</p>
      <a href="index-style-b.html" class="btn btn-primary">다음: Style B 보기 →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
